# VisioForge MCP Server - Nginx reverse proxy configuration
# The MCP app listens on 5001 because port 5000 is taken by another service on
# the host; keep proxy_pass below in step with ASPNETCORE_URLS in
# visioforge-mcp.service.
# Place this file at /etc/nginx/sites-available/visioforge-mcp
# Then: ln -s /etc/nginx/sites-available/visioforge-mcp /etc/nginx/sites-enabled/

# Rate limiting zone — 30 requests/sec per IP with burst allowance
limit_req_zone $binary_remote_addr zone=mcp:10m rate=30r/s;

server {
    listen 80;
    server_name mcp.visioforge.com;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    server_name mcp.visioforge.com;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/mcp.visioforge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.visioforge.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mcp.visioforge.com/chain.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # MCP endpoint - supports both Streamable HTTP and legacy SSE
    location /mcp {
        proxy_pass http://localhost:5001/mcp;
        proxy_http_version 1.1;

        # Required for SSE (Server-Sent Events) support
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running MCP sessions
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Allow chunked transfer encoding
        chunked_transfer_encoding on;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:5001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Root info endpoint
    location / {
        proxy_pass http://localhost:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Rate limiting — 30 req/s per IP, burst up to 50
    limit_req zone=mcp burst=50 nodelay;
    limit_req_status 429;

    # Logging
    access_log /var/log/nginx/visioforge-mcp-access.log;
    error_log /var/log/nginx/visioforge-mcp-error.log;
}
